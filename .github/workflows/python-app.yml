Updated workflow

```yaml
name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
```

Key points

--cov=. — measure coverage for the whole project. Replace with your package name (e.g. --cov=myapp) to avoid counting tests themselves.

--cov-report=xml — produces coverage.xml for Codecov.
--cov-report=term-missing — prints uncovered lines in the CI log so you don't have to open Codecov for quick checks.

if: matrix.python-version == '3.12' — only upload once, otherwise three matrix jobs race to upload and Codecov merges/flags them. Use your newest version here.

token: ${{ secrets.CODECOV_TOKEN }} — required for private repos, and recommended for public ones since Codecov tightened upload rules in 2023. Get the token from codecov.io → your repo → Settings → General.

fail_ci_if_error: false — I'd start with false so a Codecov outage doesn't break your build. Flip to true once you trust it.

Optional: enforce a coverage floor

Add to your pyproject.toml:

```toml
[tool.coverage.run]
source = ["myapp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
```

Then simplify the CI command to just pytest --cov --cov-report=xml. The fail_under will make the test step exit non-zero if coverage drops below 80%. This is usually better than putting the threshold in the CI YAML, since it keeps the rule next to the code.

Add a README badge

```markdown
[![codecov](https://codecov.io/gh/OWNER/REPO/branch/main/graph/badge.svg)](https://codecov.io/gh/OWNER/REPO)
```

