Say Next and I'll add pre-commit hooks (item 2), or tell me if you want to jump to a different item.Moving on to item 2: pre-commit hooks. This enforces formatting and linting locally and in CI, so developers catch issues before pushing.

1. Create .pre-commit-config.yaml at the repo root

```yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=127", "--extend-ignore=E203,W503"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: ["--ignore-missing-imports"]
```

Notes:

· Pin the rev: to a tag. Dependabot (item 3) can bump these for you later.
· If you don't want mypy yet, delete that block — it's the most opinionated one.
· --extend-ignore=E203,W503 avoids conflicts between black and flake8.

2. Add the CI step

Insert this before the flake8 step in your workflow:

```yaml
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
```

pre-commit/action runs all hooks against all files, failing the job if anything is dirty. It also caches hook environments via actions/setup-python's pip cache, so subsequent runs are fast.

If you want to keep the existing inline flake8 steps too, that's fine — they're redundant but harmless. I'd personally delete them and let pre-commit own linting.

3. Install locally

Each developer runs once:

```bash
pip install pre-commit
pre-commit install
```

After that, every git commit runs the hooks on staged files. To run against the whole repo manually:

```bash
pre-commit run --all-files
```

4. Full updated workflow

```yaml
name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
```

Tips

· Don't run pre-commit across the matrix. It doesn't depend on the Python version and just triples the runtime. If you want it once, split it into a separate job:

```yaml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - uses: pre-commit/action@v3.0.1
```

Then the build job only runs tests. Cleaner separation, faster CI.

· Skip hooks when needed: git commit --no-verify bypasses them locally, but CI will still fail. That's the point.
· Renovate / Dependabot can auto-bump the rev: values — which is exactly item 3.

