Issues

1. Outdated setup-python action
actions/setup-python@v3 is old (Node 16, deprecated). Use @v5.

2. Only triggers on master
If your repo's default branch is main, this workflow never runs. Verify your default branch, or list both:

```yaml
branches: [ "main", "master" ]
```

3. pytest returns exit code 5 when no tests are collected
If the repo has no tests yet, the job fails with a confusing "no tests ran" error. Either add || [ $? -eq 5 ] or ensure tests/ exists.

4. No pip caching
Every run re-downloads dependencies. Add cache: 'pip' to setup-python.

5. Linting the whole repo (.)
This walks .git, any vendored code, etc. Prefer scoping to your package, e.g. flake8 src tests.

6. Single Python version
Consider a matrix for broader compatibility.

Improved version

```yaml
name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Fail on syntax errors / undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only for style
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest
```

Minor notes

· If you use pyproject.toml / setup.cfg, consider configuring flake8 there instead of CLI flags.
· If you later add coverage, use pytest --cov and upload to Codecov.
· For faster CI on monorepos, add paths filters so the workflow only runs when Python files change.

