# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          This is the standard GitHub-provided PyPI publishing workflow. It's solid, but here are some observations and suggested improvements depending on your needs.

What it does well

· Trusted publishing (OIDC) via id-token: write — no API tokens needed.
· Two-stage job (build → publish) so the artifact is inspectable and reusable.
· Environment protection (pypi) allows required reviewers.

Issues / things to double-check

1. python-version: "3.x" — this floats to the latest 3.x, so your sdist/wheel metadata can silently change between releases. Prefer pinning, e.g. "3.12", or a matrix if you publish pure-Python wheels that should support old versions.
2. No version sanity check. If your pyproject.toml version doesn't match the Git tag, PyPI will reject it (or worse, publish the wrong version). A quick guard helps:
   ```yaml
   - name: Verify version matches tag
     run: |
       python -c "import tomllib,sys,os; \
         v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; \
         sys.exit(0 if v==os.environ['GITHUB_REF_NAME'].lstrip('v') else 1)"
   ```
3. Artifact download needs a fresh checkout only if you build step-by-step. You're not building in the publish job — good. But pypa/gh-action-pypi-publish will happily publish anything in dist/, so consider attestations: true (see below).
4. No attestations: true. GitHub now supports build provenance attestations for PyPI (PEP 740). Add:
   ```yaml
   - uses: pypa/gh-action-pypi-publish@release/v1
     with:
       packages-dir: dist/
       attestations: true
   ```
   and add attestations: write + artifact-metadata: write to the job permissions.
5. environment.url — uncomment it. Without it, the GitHub deployment shows no link to PyPI:
   ```yaml
   url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}
   ```
6. No TestPyPI dry run. For first-time setup, publishing to TestPyPI first saves you from burning release numbers. You can gate it by github.event.release.prerelease or a separate workflow_dispatch.
7. Missing permissions: contents: read on the publish job. It's not needed for OIDC, but the top-level contents: read doesn't cascade — each job inherits only repo defaults. Setting it explicitly is cleaner if you later tighten defaults.
8. actions/setup-python@v5 with cache: — if you have dev dependencies, caching speeds builds up:
   ```yaml
   with:
     python-version: "3.12"
     cache: pip
   ```
9. No sdist-only or wheel-only filter. If you only want one format:
   ```yaml
   - run: python -m build --sdist
   ```
   or --wheel.
10. Skipping skip-existing — if a re-run happens after a partial upload, the publish step fails on already-uploaded files. Add skip-existing: true for idempotency (useful with re-triggered workflows).

Minimal hardened version

```yaml
name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
      attestations: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true
```

If you tell me your project layout (pyproject.toml vs setup.py, package name, whether you want TestPyPI first), I can tailor it further.Assuming “Next” means the next step after the basic PyPI publish workflow, the most useful addition is a TestPyPI dry-run so you can validate the whole pipeline (build → OIDC → upload) without burning a real PyPI version.

Add a TestPyPI job triggered manually or on prereleases

```yaml
name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:        # manual trigger for TestPyPI dry-run

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  # ── TestPyPI (dry-run) ─────────────────────────────────────────────
  testpypi-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/project/YOURPROJECT/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ── Real PyPI ──────────────────────────────────────────────────────
  pypi-publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
      attestations: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true
```

What you still need to do on the PyPI side

1. Create a trusted publisher for testpypi and pypi environments:
   · PyPI → Your project → Publishing → Add a new pending publisher
   · Owner: your GitHub user/org, Repo: your repo, Workflow: python-publish.yml, Environment: testpypi (or pypi)
2. Create matching GitHub environments (testpypi, pypi) under Settings → Environments and add required reviewers if desired.

