```

tests/test_smoke.py:

```python
from myproject import __version__


def test_version_is_string():
    assert isinstance(__version__, str)
    assert __version__
```

3. Branch protection & environment rules

Settings → Branches → Add rule for main:

· ✅ Require pull request before merging (1 approval)
· ✅ Require status checks to pass: test (3.10), test (3.11), test (3.12), test (3.13)
· ✅ Require linear history
· ✅ Require conversation resolution
· ✅ Do not allow bypassing the above settings
· ❌ Do not enable "Require signed commits" unless you sign locally

Settings → Actions → General:

· Workflow permissions: Read repository contents and packages permissions (workflows escalate per-job)
· ✅ Allow GitHub Actions to create and approve pull requests (needed by semantic-release to push the release commit)

Settings → Environments:

Environment Protection rule Who can use it
pypi Required reviewers (≥1), restrict branch to main, allow tags v* Maintainers
testpypi Optional reviewer Maintainers
github-pages (auto-created by Pages) —

Settings → Pages: Source = GitHub Actions (needed for the MkDocs workflow; mkdocs gh-deploy pushes to a gh-pages branch, so you can leave it as "Deploy from a branch → gh-pages" instead — pick one, not both. The deploy.yml variant that uses actions/deploy-pages is cleaner; the one below uses gh-deploy, so set Pages to gh-pages branch.)

Tags: GITHUB_TOKEN can push tags unless you also protect them. To protect release tags:

· Settings → Tags → New rule → pattern v* → restrict creation to maintainers.

4. Trimmed workflow set

You said pure-Python (no C extensions) and MkDocs — so drop cibuildwheel and drop Sphinx. That leaves three workflows (plus optional Docker).

.github/workflows/ci.yml

(unchanged from earlier — see previous message)

.github/workflows/release.yml

```yaml
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: pip install python-semantic-release build

      - name: Semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

      - name: Build
        if: steps.release.outputs.released == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true
```

The if: "!contains(...)" guard prevents infinite loops — semantic-release pushes a chore(release): commit, which would otherwise retrigger the workflow.

.github/workflows/docs.yml

```yaml
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install mkdocs-material "mkdocstrings[python]"

      - name: Build & deploy
        run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

.github/workflows/docker.yml (delete if unused)

Same as the earlier GHCR workflow — triggers on push: tags: ['v*'].

---

First-run checklist

1. git init and push the skeleton above to main on GitHub.
2. Add a pending trusted publisher on PyPI and TestPyPI:
   · Owner: YOURUSER, Repo: myproject, Workflow: release.yml, Environment: pypi (or testpypi).
3. Create the pypi environment in Settings → Environments with yourself as reviewer.
4. Create the pypi/testpypi environment names to match exactly.
5. Push a commit like feat: initial release to main — semantic-release will bump to 0.1.0, tag v0.1.0, create a GitHub Release, and publish to PyPI.
6. Verify docs at https://YOURUSER.github.io/myproject/ after the first docs.yml run.

Everything here is pure-Python and MkDocs-specific, so there's no wheel matrix to maintain and no Sphinx config to fight. If you later add a C extension, add back the build_wheels.yml from the earlier message and switch release.yml to consume its artifacts instead of building inline.
Here's each of the six first-run steps expanded with exact commands, UI paths, and the gotchas that bite people.

---

Step 1 — Initialize and push the skeleton

Local setup

```bash
# Create the project directory
mkdir myproject && cd myproject

# Create the directory tree
mkdir -p .github/workflows docs src/myproject tests

# Create placeholder files
touch src/myproject/__init__.py src/myproject/py.typed
touch tests/__init__.py tests/test_smoke.py
touch docs/index.md docs/api.md
touch README.md CHANGELOG.md LICENSE mkdocs.yml pyproject.toml
touch .gitignore

# Initialize git
git init -b main
git add -A
git commit -m "chore: initial scaffold"
```

Minimal .gitignore:

```gitignore
__pycache__/
*.py[cod]
*.egg-info/
.eggs/
build/
dist/
.venv/
venv/
.pytest_cache/
.ruff_cache/
.mypy_cache/
.coverage
coverage.xml
htmlcov/
site/
.idea/
.vscode/
.DS_Store
```

Create the repo on GitHub

Option A (gh CLI):

```bash
gh repo create YOURUSER/myproject --public --source=. --remote=origin --push
```

Option B (web UI):

1. github.com → New repository
2. Name: myproject, visibility: Public, do not initialize with README/gitignore/license (you already have them)
3. Copy the git remote add origin … command GitHub shows:

```bash
git remote add origin git@github.com:YOURUSER/myproject.git
git push -u origin main
```

Gotcha: If you use SSH, make sure your key is loaded (ssh-add -l). If you use HTTPS, you'll need a PAT, not your password.

---

Step 2 — Add the pending trusted publisher on PyPI

You must do this before the first workflow run, otherwise the upload fails with invalid-publisher.

On PyPI

1. Go to https://pypi.org/manage/account/publishing/
2. Under Add a new pending publisher, fill in:
   · PyPI project name: myproject (must match [project].name in pyproject.toml exactly — case-sensitive, hyphens vs underscores matter)
   · Owner: YOURUSER (GitHub username/org, exactly)
   · Repository name: myproject
   · Workflow name: release.yml
   · Environment name: pypi
3. Click Add

On TestPyPI (do this too)

Same steps at https://test.pypi.org/manage/account/publishing/ but use environment testpypi.

Gotchas

· The project name must not exist yet for a pending publisher. If myproject is taken on PyPI, either rename your package or claim the name first.
· Environment name is case-sensitive. pypi ≠ PyPI. Match the workflow exactly.
· The workflow filename must be the file's base name (release.yml), not the path.
· If you already own the project on PyPI, you must add the publisher from Manage project → Publishing instead — the pending publisher path is only for packages that don't exist yet.

---

Step 3 — Create the pypi environment in GitHub

1. GitHub repo → Settings → Environments → New environment
2. Name: pypi → Configure environment
3. Under Deployment protection rules:
   · ✅ Required reviewers → add yourself (and any co-maintainers)
   · ✅ Prevent self-review (optional but recommended if you have >1 maintainer)
4. Under Deployment branches and tags:
   · Select Selected branches and tags
   · Add a branch rule: main
   · Add a tag rule: v*
5. Click Save protection rules

Repeat for testpypi (no reviewers needed — it's a sandbox).

Gotchas

· If you forget the environment, the OIDC token has no environment claim and PyPI rejects it.
· If required reviewers are set, the workflow pauses on the deploy step and waits for you to click Review deployments in the Actions UI — this is expected.
· Environment secrets/vars are only visible inside jobs that declare environment: pypi.

---

Step 4 — Verify environment names match

This is where silent failures live. The three places must agree:

Location Value
release.yml → job → environment: name: pypi
PyPI pending publisher → Environment name pypi
GitHub Settings → Environments pypi

Same for testpypi. Quick grep:

```bash
grep -R "environment" .github/workflows/
grep -R "pypi\|testpypi" .github/workflows/
```

Also confirm the workflow filename:

```bash
ls .github/workflows/
# release.yml, ci.yml, docs.yml, docker.yml
```

If you renamed anything, update the pending publisher on PyPI (you can delete and re-add).

Gotcha: Renaming the workflow file later breaks trusted publishing. If you rename release.yml → publish.yml, you must update the publisher on PyPI first.

---

Step 5 — Trigger the first release

Make sure CI passes first

Push a trivial commit and watch ci.yml:

```bash
git commit --allow-empty -m "chore: trigger ci"
git push
```

Go to Actions → CI. All four Python versions should be green. If not, fix before proceeding — the release workflow will not gate on CI by default (you'd need workflow_run for that).

Trigger the release

Semantic-release only reacts to conventional commits on main. Make one:

```bash
# Edit something real, e.g. add a function
cat > src/myproject/__init__.py <<'EOF'
"""myproject — short description."""

from importlib.metadata import PackageNotFoundError, version

try:
    __version__ = version("myproject")
except PackageNotFoundError:
    __version__ = "0.0.0"

def hello() -> str:
    """Return a friendly greeting."""
    return "hello, world"

__all__ = ["__version__", "hello"]
EOF

git add src/myproject/__init__.py
git commit -m "feat: add hello() function"
git push
```

What should happen

1. Actions → Release starts.
2. semantic-release version runs:
   · Detects feat: → bumps 0.1.0 → 0.2.0 (or 0.1.0 if starting from nothing)
   · Updates pyproject.toml, creates a commit chore(release): 0.2.0
   · Tags v0.2.0
   · Pushes both
3. semantic-release publish creates the GitHub Release and updates CHANGELOG.md.
4. Build runs → dist/myproject-0.2.0.tar.gz + .whl.
5. Publish job pauses for your approval (if reviewers are set) → click Review deployments → Approve.
6. Package appears at https://pypi.org/project/myproject/0.2.0/.

Gotchas

· If you skip the feat:/fix: prefix, semantic-release does nothing. Test locally first:
  ```bash
  pip install python-semantic-release
  semantic-release --noop version
  ```
· First run may fail with no version found if the current version in pyproject.toml isn't a valid starting point. 0.1.0 is fine.
· GITHUB_TOKEN can't push tags if the tag is protected by another rule. Check Settings → Tags.
· If the workflow runs twice and the second fails on "tag already exists", add the if: "!contains(github.event.head_commit.message, 'chore(release):')" guard (already in the workflow) — it prevents re-triggering on the release commit.

---

Step 6 — Verify docs deploy

First successful build

1. Push any commit touching docs/, mkdocs.yml, or src/**:
   ```bash
   echo "# API" > docs/api.md
   git add docs/api.md
   git commit -m "docs: add api page"
   git push
   ```
2. Actions → Docs runs mkdocs gh-deploy --force, which pushes a gh-pages branch.
3. Go to Settings → Pages:
   · Source: Deploy from a branch
   · Branch: gh-pages / / (root)
   · Save
4. After ~1 minute, docs are live at https://YOURUSER.github.io/myproject/.

Custom domain (optional)

If you want docs.example.com:

1. In docs/, create CNAME containing docs.example.com.
2. In Settings → Pages → Custom domain, enter the same.
3. Add a DNS CNAME record: docs → YOURUSER.github.io.
4. Enable Enforce HTTPS.

Gotchas

· mkdocs gh-deploy overwrites the gh-pages branch on every run. If you put non-MkDocs files there manually, they'll be wiped. Use actions/deploy-pages if you need full control.
· mkdocstrings needs the package importable. That's why the workflow does pip install -e ".[dev]" before building. If your docs import a package that isn't installed, the build fails.
· First run is often red because mkdocs.yml references files that don't exist yet (api.md, index.md). Create empty placeholders:
  ```bash
  echo "# myproject" > docs/index.md
  echo "# API Reference" > docs/api.md
  ```
· site_url mismatch — if site_url in mkdocs.yml doesn't match where Pages serves it, links break. Match it to https://YOURUSER.github.io/myproject/.
· Private repos: GitHub Pages requires a public repo on Free plans. Either make the repo public or upgrade.

---

After all six steps: the steady-state loop

Once everything is wired, day-to-day is:

```bash
git checkout -b feat/some-feature
# …make changes…
git commit -m "feat: add some feature"
git push -u origin feat/some-feature
gh pr create --fill     # or open PR in UI

# PR runs CI → merge to main
# Release workflow bumps version, tags, publishes to PyPI, updates changelog
# Docs workflow rebuilds the site
```

You only touch PyPI/GitHub settings again if you:

· Rename the workflow file
· Rename the repo
· Move to a different GitHub org
· Add a new environment (e.g. pypi-staging)

If any of the six steps fails, paste the exact error from the Actions log and I'll pinpoint it.👍 You're set. Ping me when you hit the first error or want to extend the setup (C extensions, type stubs, TestPyPI dry-run, custom domain, etc.).
