Which one should I do next?Here are complete GitHub Actions workflows for all five areas. I'll build them as a unified release pipeline rather than disconnected pieces.

1. CI for Tests & Lint (ci.yml)

Run this on every push/PR to catch issues before release:

```yaml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest -q --cov=src --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
```

Key points: fail-fast: false so you see all Python versions; cache: pip speeds up installs; concurrency cancels stale runs.

2. Version Management (release.yml)

Two main approaches — pick one:

Option A: python-semantic-release (fully automated from commit messages)

```yaml
name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributions
        if: steps.release.outputs.released == 'true'
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Upload to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/upload-to-gh-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
```

Configure in pyproject.toml:

```toml
[tool.semantic_release]
branch = "main"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
```

Option B: bump-my-version (manual/semi-automated, more control)

```yaml
name: Bump Version

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: "Release kind"
        required: true
        type: choice
        options: [major, minor, patch]

permissions:
  contents: write
  id-token: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install bump-my-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: bump-my-version bump --verbose ${{ inputs.release_kind }}

      - name: Push changes
        run: git push && git push --tags
```

Configure in pyproject.toml:

```toml
[tool.bumpversion]
current_version = "0.1.0"
tag_format = "v{new_version}"
commit = true
tag = true
```

3. Multi-Platform Wheels (build_wheels.yml)

Use cibuildwheel to build manylinux, musllinux, macOS, and Windows wheels in one job:

```yaml
name: Build Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["cp310", "cp311", "cp312", "cp313"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: "*-musllinux_ppc64le *-musllinux_s390x"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
```

If you have pure-Python code (no C extensions), you can skip cibuildwheel entirely and just build a universal wheel with python -m build in your existing release job — it's much faster.

4. Documentation

Option A: MkDocs → GitHub Pages (simpler, recommend for most projects)

```yaml
name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install mkdocs-material mkdocstrings[python]

      - run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

Option B: Sphinx → Read the Docs (via direct upload)

```yaml
name: Build Docs

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r docs/requirements.txt

      - run: sphinx-build -b html docs/ _build/html

      - uses: readthedocs/upload-action@v1
        with:
          token: ${{ secrets.READTHEDOCS_TOKEN }}
          project-slug: my-project
          html: _build/html
```

You'll need a READTHEDOCS_TOKEN secret from your RTD account.

5. Container Images → GHCR

```yaml
name: Publish Container

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
```

GITHUB_TOKEN is automatically provided — no extra secrets needed for GHCR.

Putting It All Together

Suggested repo structure:

```
.github/workflows/
  ci.yml              # tests + lint on every push/PR
  release.yml         # version bump → PyPI + GH Release
  build_wheels.yml    # multi-platform wheels
  docs.yml            # docs deploy
  docker.yml          # container to GHCR
```

Ordering considerations:

· ci.yml gates everything — make release.yml, build_wheels.yml, and docs.yml depend on it passing (via workflow_run or branch protection rules).
· release.yml triggers on push to main (semantic-release) or manual workflow_dispatch (bump-my-version).
· build_wheels.yml and docker.yml trigger on version tags (v*), which release.yml creates.
· docs.yml can run independently on doc changes or on release.

Secrets you need to configure:

Secret Where Purpose
GITHUB_TOKEN automatic GHCR push, GitHub Release, Pages deploy
READTHEDOCS_TOKEN repo secret RTD upload (if using Option B for docs)
(none for PyPI) — Trusted Publishing uses OIDC

One caution: if you're using semantic-release, it creates the tag itself — don't also trigger wheel/container builds on release: published, or you'll get a race. Trigger them on push: tags: ['v*'] instead, since semantic-release pushes the tag.

